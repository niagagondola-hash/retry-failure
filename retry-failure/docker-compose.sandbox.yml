# ============================================================
# retry-failure — Docker Compose (sandbox profile)
# ============================================================
# Per plan2 AUTH-23 section 14.1 + section 14.5:
#   - Minimal services: postgres only.
#   - NO Redis, NO Jaeger, NO Prometheus, NO Grafana.
#   - Apps (payment-api, auth-mock, payment-gateway-mock, frontend-vue) run
#     via `pnpm dev` or `pnpm dev:sandbox` (host node, hot-reload).
#   - SESSION_STORE=memory (no Redis dependency).
#   - AUTH_MODE=mock (use auth-mock running locally on host, port 4001).
#
# Usage:
#   docker compose -f docker-compose.sandbox.yml up -d
#   docker compose -f docker-compose.sandbox.yml ps
#   docker compose -f docker-compose.sandbox.yml down
#
# Or via root package.json script:
#   pnpm docker:up:sandbox
#   pnpm docker:down:sandbox
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: retry-failure-sandbox-postgres
    environment:
      POSTGRES_USER: retry_failure
      POSTGRES_PASSWORD: retry_failure
      POSTGRES_DB: retry_failure
    ports:
      - '5432:5432'
    volumes:
      - pgdata-sandbox:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retry_failure -d retry_failure']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata-sandbox:
    driver: local
