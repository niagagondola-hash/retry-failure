# ============================================================
# retry-failure — Docker Compose (dev profile)
# ============================================================
# Per plan2 AUTH-23 section 14.1:
#   - Default profile (this file): full dev stack
#       postgres + redis + auth-mock + jaeger + prometheus + grafana
#   - Sandbox profile (docker-compose.sandbox.yml): minimal
#       postgres only (no Redis/Jaeger/Prometheus/Grafana)
#   - Apps (payment-api, payment-gateway-mock, frontend-vue) run via
#     `pnpm dev` (nest start --watch / vite) — not containerized by default
#     (hot-reload workflow lebih cepat via host node).
#
# AUTH-23 (plan2 section 14.2) — services added:
#   - redis (port 6379, AOF + maxmemory 256mb LRU, healthcheck redis-cli ping)
#   - auth-mock (port 4001, build from apps/auth-mock, dev watch)
#     NOTE: requires apps/auth-mock/Dockerfile (created in separate task)
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: retry-failure-postgres
    environment:
      POSTGRES_USER: retry_failure
      POSTGRES_PASSWORD: retry_failure
      POSTGRES_DB: retry_failure
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retry_failure -d retry_failure']
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Redis — session store for SESSION_STORE=redis (plan2 AUTH-23 §14.2)
  # Used by payment-api SessionStore (RedisSessionStore impl).
  # Not needed for sandbox (SESSION_STORE=memory).
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: retry-failure-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # auth-mock — OAuth2 reference implementation (plan2 AUTH-01 + AUTH-23 §14.2)
  # Build from apps/auth-mock (requires Dockerfile — created in separate task).
  # Port 4001 (range terpisah dari 3001/3002 supaya clear).
  # ============================================================
  auth-mock:
    build:
      context: ./apps/auth-mock
      dockerfile: Dockerfile
    container_name: retry-failure-auth-mock
    ports:
      - '4001:4001'
    environment:
      AUTH_MOCK_PORT: '4001'
      NODE_ENV: development
    volumes:
      - ./apps/auth-mock:/app
      - /app/node_modules
    command: pnpm start:dev
    depends_on:
      postgres:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: retry-failure-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: retry-failure-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: retry-failure-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3003:3000' # Grafana on 3003 (avoid conflict with Next.js on 3000)
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
