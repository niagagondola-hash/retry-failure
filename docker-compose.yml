services:
  postgres:
    image: postgres:16-alpine
    container_name: retry-failure-postgres
    environment:
      POSTGRES_USER: retry_failure
      POSTGRES_PASSWORD: retry_failure
      POSTGRES_DB: retry_failure
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retry_failure -d retry_failure']
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: retry-failure-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
      - '4318:4318' # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: retry-failure-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: retry-failure-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '3003:3000' # Grafana on 3003 (avoid conflict with Next.js on 3000)
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
    driver: local
